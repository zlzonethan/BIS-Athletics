<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BIS Bobcat 로고와 변형들을 한 곳에 정리한 페이지입니다.">
  <title>BIS Bobcat — 개선본</title>
  <style>
    :root{--bg:#f7f8fb;--card:#fff;--accent:#0055a5;--muted:#555}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;line-height:1.4;margin:0;background:var(--bg);color:#111}
    .container{max-width:1100px;margin:32px auto;padding:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px}
    header h1{margin:0;font-size:1.6rem}
    .lead{color:var(--muted);font-size:0.95rem}
    .bobcat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:20px}
    .bobcat-card{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(12,18,31,0.06);display:flex;flex-direction:column;align-items:center;text-align:center}
    .bobcat-card h3{margin:8px 0 6px;font-size:1.05rem;color:var(--accent)}
    .bobcat-img{width:100%;max-width:260px;height:auto;border-radius:6px;object-fit:contain}
    .bobcat-note{color:var(--muted);font-size:0.9rem;margin-top:8px}
    .bobcat-link{margin-top:10px;display:inline-block;padding:8px 12px;border-radius:6px;background:var(--accent);color:white;text-decoration:none}
    .bobcat-link:focus,.bobcat-link:hover{opacity:0.95}
    @media (max-width:420px){.container{padding:12px}header h1{font-size:1.25rem}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>BIS BOBCAT</h1>
        <div class="lead">학교 로고(보브캣) 모음 — 공식/레트로/대체 버전</div>
      </div>
      <nav aria-label="사이트 내비게이션">
        <a href="index.html" class="bobcat-link" style="background:transparent;color:var(--accent);padding:6px 10px;border:1px solid var(--accent)">홈으로</a>
      </nav>
    </header>

    <main>
      <section aria-labelledby="bobcat-list">
        <h2 id="bobcat-list" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden">Bobcat 로고 목록</h2>
        <div class="bobcat-grid">

          <article class="bobcat-card" aria-labelledby="main-bobcat">
            <h3 id="main-bobcat">Main 2025 Bobcat</h3>
            <img class="bobcat-img" loading="lazy" src="https://lh3.googleusercontent.com/sitesv/APaQ0ST0tIHn3E0LhFovVFM9z2JoCAg8hMiB8JOrG4k0yQheJqTC4RBOtPbtoB5qsfp7KG181hKZsaHjtunpRJvsqXSG2BhFiB2WHG7AaMrC0G8GB2jjJgLoewCaghCHLQXqP-tNmI5KZXesUm4DD4oJsMRiJ--O2lDCmKmHgkNkzQkQg9pjTeElkGfbhdJMf6LzLyhV7h5HLTX9ZbNiv4FTQBSOWcOw_KJTAMDFX8A=w1280" alt="BIS Main 2025 Bobcat 로고">
            <div class="bobcat-note">공식 메인 로고 — 학교 문서와 홍보물에 사용</div>
            <a class="bobcat-link" href="#" aria-label="Main 2025 Bobcat 크게 보기">자세히 보기</a>
          </article>

          <article class="bobcat-card" aria-labelledby="retro-bobcat">
            <h3 id="retro-bobcat">Retro Alternate Bobcat</h3>
            <img class="bobcat-img" loading="lazy" src="https://lh3.googleusercontent.com/sitesv/APaQ0SRuLOMbIV870R05e7iyQ5aEwp7peZ0Q5XDqjDUGPMWKinQ5Djw5d5LGk8Vx5A_sTQftwzG9q8DjB1qW_iiLYUNDdu9kuZzHrzzEFk-ik2SPzSnwS3Uaffdgd_fMqFOe8zVlEVfmnaTjyrydaR9Zqtho2-Sk9zzkjmL_z2sc8Kb6g4bHKtzzHmDmv2cPH0i_7ta6pc8GiFVdxQQu3De1MIesQ_qOO_D3rEzb=w1280" alt="Retro Bobcat 로고">
            <div class="bobcat-note">레트로 스타일의 대체 로고</div>
            <a class="bobcat-link" href="#" aria-label="Retro Bobcat 크게 보기">자세히 보기</a>
          </article>

          <article class="bobcat-card" aria-labelledby="monogram-bobcat">
            <h3 id="monogram-bobcat">Monogram / Emblem</h3>
            <img class="bobcat-img" loading="lazy" src="assets/bobcat-monogram.png" alt="Bobcat 모노그램 로고">
            <div class="bobcat-note">유니폼이나 소형 아이콘에 적합한 모노그램</div>
            <a class="bobcat-link" href="#" aria-label="Monogram Bobcat 크게 보기">자세히 보기</a>
          </article>

        </div>
      </section>
    </main>

  </div>
</body>
</html>
