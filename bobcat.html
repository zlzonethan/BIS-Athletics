<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-frame-options" content="allow" />
  <title>BIS Bobcat</title>
  <meta name="description" content="Check the BIS Bobcat logo system, retro version, and official color guide." />
  <link rel="canonical" href="https://bis-athletics.web.app/bobcat.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BIS Bobcat" />
  <meta property="og:description" content="Check the BIS Bobcat logo system, retro version, and official color guide." />
  <meta property="og:url" content="https://bis-athletics.web.app/bobcat.html" />
  <meta property="og:image" content="https://bis-athletics.web.app/assets/bismascot.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BIS Bobcat" />
  <meta name="twitter:description" content="Check the BIS Bobcat logo system, retro version, and official color guide." />
  <meta name="twitter:image" content="https://bis-athletics.web.app/assets/bismascot.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f5f7;
      --text: #0f172a;
      --muted: #6b7280;
      --panel: #ffffff;
      --accent: #0b1b3a;
      --nav-muted: rgba(15, 23, 42, 0.7);
      --border: rgba(148, 163, 184, 0.12);
    }
    body.dark {
      --bg: #0a1120;
      --text: #f8fafc;
      --muted: #9aa4b2;
      --panel: #0f1a2b;
      --nav-muted: rgba(248, 250, 252, 0.8);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      width: 100%;
      overflow-x: hidden;
    }
    html {
      scrollbar-width: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
    body {
      font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 24px 40px; }

    /* Navigation */
    .top-nav { position: relative; display: flex; align-items: center; justify-content: center; gap: 0; color: var(--nav-muted); font-weight: 700; letter-spacing: 0.4px; }
    .nav-center { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 80px; margin: 0 auto; width: 100%; }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 120px; }
    .nav-left { justify-content: flex-end; }
    .nav-right { justify-content: flex-start; }
    .top-nav .nav-item { position: relative; display: flex; align-items: center; gap: 10px; color: var(--nav-muted); text-decoration: none; }
    .top-nav .nav-item:hover, .top-nav .nav-item:focus { text-decoration: none; }
    .top-nav .logo { width: 48px; height: 48px; object-fit: contain; }

    /* Hero */
    .hero { text-align: center; margin: 24px 0 28px; }
    .hero h1 {
      font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
      font-weight: 400;
      font-size: clamp(36px, 7vw, 64px);
      letter-spacing: 1px;
    }

    /* Panel Card */
    .panel {
      background: var(--panel);
      border-radius: 24px;
      padding: 40px 32px 48px;
      box-shadow: none;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .bobcat-img-main {
      width: 100%;
      max-width: 320px;
      height: auto;
      object-fit: contain;
    }
    .bobcat-title {
      margin-top: 24px;
      font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
      font-weight: 400;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    /* Retro Grid */
    .retro-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
    }
    .retro-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .retro-item img {
      width: 100%;
      max-width: 200px;
      height: auto;
      object-fit: contain;
    }
    .retro-item-title {
      margin-top: 14px;
      font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.3px;
    }
    @media (max-width: 720px) {
      .retro-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .retro-item img {
        max-width: 180px;
      }
    }

    /* Color Grid */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      width: 100%;
    }
    .color-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .color-swatch {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      border: 3px solid rgba(148, 163, 184, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .color-swatch:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
    }
    .color-name {
      margin-top: 12px;
      font-weight: 700;
      font-size: 14px;
    }
    .color-code {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'Courier New', monospace;
      font-weight: 600;
      background: var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .color-code:hover {
      background: var(--accent);
      color: #fff;
    }
    @media (max-width: 720px) {
      .color-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .color-swatch {
        width: 64px;
        height: 64px;
      }
    }
    @media (max-width: 480px) {
      .color-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .tab-btn {
      padding: 10px 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tab-btn:hover:not(.active) {
      background: var(--border);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Theme toggle */
    .theme-toggle-wrap { display: flex; justify-content: center; margin-top: 24px; }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.6);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(6px);
      transition: transform 0.2s;
    }
    .theme-toggle:hover { transform: scale(1.02); }

    /* Responsive */
    @media (max-width: 860px) {
      .top-nav { gap: 40px; }
      .nav-center { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
      .nav-left, .nav-right { gap: 24px; justify-content: center; }
    }
    @media (max-width: 600px) {
      .wrap { padding: 12px 16px 40px; }
      .top-nav { gap: 20px; }
      .nav-center { gap: 16px; }
      .nav-left, .nav-right { gap: 16px; font-size: 14px; }
      .top-nav .logo { width: 40px; height: 40px; }
      .panel { padding: 28px 20px 36px; border-radius: 18px; }
      .bobcat-img-main { max-width: 240px; }
      .bobcat-title { font-size: 22px; margin-top: 18px; }
    }

    @media (max-width: 360px) {
      .wrap { padding: 10px 12px 50px; }
      .nav-left, .nav-right { gap: 12px; font-size: 12px; }
      .top-nav .logo { width: 36px; height: 36px; }
    }

    /* iframe embed support */
    html.in-iframe, html.in-iframe body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
    html.in-iframe .wrap {
      max-width: 100%;
      padding: 12px 16px 24px;
    }
    html.in-iframe body {
      -webkit-text-size-adjust: 100%;
    }
    html.in-iframe-mobile .wrap {
      max-width: 100%;
      padding: 12px 14px 24px;
    }
    html.in-iframe-mobile .nav-center {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    html.in-iframe-mobile .nav-left,
    html.in-iframe-mobile .nav-right {
      gap: 16px;
      justify-content: center;
      font-size: 14px;
    }
    html.in-iframe-mobile .top-nav .logo {
      width: 40px;
      height: 40px;
    }
  </style>
  <script>
    // Detect iframe and add class
    (function() {
      const ua = navigator.userAgent || '';
      const isLikelyMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua));
      try {
        if (window.self !== window.top || window.frameElement) {
          document.documentElement.classList.add('in-iframe');
          if (isLikelyMobile) document.documentElement.classList.add('in-iframe-mobile');
        }
      } catch (e) {
        document.documentElement.classList.add('in-iframe');
        if (isLikelyMobile) document.documentElement.classList.add('in-iframe-mobile');
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <nav class="top-nav">
      <div class="nav-center">
        <div class="nav-left">
          <a class="nav-item" href="bobcat.html">Bobcat</a>
          <a class="nav-item" href="team.html">Team</a>
        </div>
        <a class="nav-logo-link" href="index.html">
          <img decoding="async" class="logo" src="assets/bismascot.png" alt="BIS mascot" />
        </a>
        <div class="nav-right">
          <a class="nav-item" href="upcoming.html">Upcoming</a>
          <a class="nav-item" href="kisaa-kaiac.html">KISAA/KAIAC</a>
        </div>
      </div>
    </nav>

    <header class="hero">
      <h1>Bobcat</h1>
    </header>

    <div class="tabs" role="tablist" aria-label="Bobcat sections">
      <button class="tab-btn active" role="tab" id="tab-bobcat" aria-selected="true" aria-controls="bobcat" data-tab="bobcat">Bobcat</button>
      <button class="tab-btn" role="tab" id="tab-retro" aria-selected="false" aria-controls="retro" tabindex="-1" data-tab="retro">Retro Bobcat</button>
      <button class="tab-btn" role="tab" id="tab-color" aria-selected="false" aria-controls="color" tabindex="-1" data-tab="color">Color</button>
    </div>

    <div id="bobcat" class="tab-content active" role="tabpanel" aria-labelledby="tab-bobcat">
      <section class="panel">
        <img class="bobcat-img-main" src="assets/bismascot.png" alt="Main Bobcat logo" />
        <h2 class="bobcat-title">Main Bobcat</h2>
      </section>
    </div>

    <div id="retro" class="tab-content" role="tabpanel" aria-labelledby="tab-retro" hidden>
      <section class="panel">
        <h2 class="bobcat-title" style="margin-top:0;margin-bottom:28px;">Retro Bobcat</h2>
        <div class="retro-grid">
          <div class="retro-item">
            <img src="assets/retro-bobcat-1.png" alt="Retro Bobcat 1" />
            <span class="retro-item-title">Retro 1</span>
          </div>
          <div class="retro-item">
            <img src="assets/retro-bobcat-2.png" alt="Retro Bobcat 2" />
            <span class="retro-item-title">Retro 2</span>
          </div>
          <div class="retro-item">
            <img src="assets/retro-bobcat-3.png" alt="Retro Bobcat 3" />
            <span class="retro-item-title">Retro 3</span>
          </div>
        </div>
      </section>
    </div>

    <div id="color" class="tab-content" role="tabpanel" aria-labelledby="tab-color" hidden>
      <section class="panel">
        <h2 class="bobcat-title" style="margin-top:0;margin-bottom:28px;">Official BIS Athletics Colors</h2>
        <div class="color-grid">
          <div class="color-item">
            <div class="color-swatch" style="background: #000000;"></div>
            <span class="color-name">Black</span>
            <button class="color-code" type="button" data-color="#000000">#000000</button>
          </div>
          <div class="color-item">
            <div class="color-swatch" style="background: #00205B;"></div>
            <span class="color-name">Bobcat Blue</span>
            <button class="color-code" type="button" data-color="#00205B">#00205B</button>
          </div>
          <div class="color-item">
            <div class="color-swatch" style="background: #A7A7A7;"></div>
            <span class="color-name">Grey</span>
            <button class="color-code" type="button" data-color="#A7A7A7">#A7A7A7</button>
          </div>
          <div class="color-item">
            <div class="color-swatch" style="background: #13B5EA;"></div>
            <span class="color-name">Sky Blue</span>
            <button class="color-code" type="button" data-color="#13B5EA">#13B5EA</button>
          </div>
          <div class="color-item">
            <div class="color-swatch" style="background: #FFFFFF; border-color: #ddd;"></div>
            <span class="color-name">White</span>
            <button class="color-code" type="button" data-color="#FFFFFF">#FFFFFF</button>
          </div>
        </div>
      </section>
    </div>

    <div class="theme-toggle-wrap">
      <button class="theme-toggle" type="button" aria-pressed="false">
        <span class="toggle-icon">🌙</span>
        <span class="toggle-text">Dark</span>
      </button>
    </div>
  </div>

  <script>
    const toggleButton = document.querySelector('.theme-toggle');
    const toggleIcon = document.querySelector('.toggle-icon');
    const toggleText = document.querySelector('.toggle-text');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

    const applyTheme = (theme) => {
      document.body.classList.toggle('dark', theme === 'dark');
      document.body.classList.toggle('light', theme === 'light');
      const isDark = theme === 'dark';
      toggleButton.setAttribute('aria-pressed', String(isDark));
      toggleIcon.textContent = isDark ? '☀️' : '🌙';
      toggleText.textContent = isDark ? 'Light' : 'Dark';
    };

    const saved = localStorage.getItem('bis-theme');
    if (saved) applyTheme(saved);
    else applyTheme(prefersDark.matches ? 'dark' : 'light');

    prefersDark.addEventListener('change', (e) => {
      if (!localStorage.getItem('bis-theme')) applyTheme(e.matches ? 'dark' : 'light');
    });

    toggleButton.addEventListener('click', () => {
      const next = document.body.classList.contains('dark') ? 'light' : 'dark';
      localStorage.setItem('bis-theme', next);
      applyTheme(next);
    });

    // Tab functionality
    const tabBtns = Array.from(document.querySelectorAll('.tab-btn'));
    const tabContents = document.querySelectorAll('.tab-content');
    const tabsWrap = document.querySelector('.tabs[role="tablist"]');
    const activateTab = (btn) => {
      const targetTab = btn.dataset.tab;
      tabBtns.forEach((b) => {
        const selected = b === btn;
        b.classList.toggle('active', selected);
        b.setAttribute('aria-selected', String(selected));
        b.tabIndex = selected ? 0 : -1;
      });
      tabContents.forEach((panel) => {
        const selected = panel.id === targetTab;
        panel.classList.toggle('active', selected);
        panel.hidden = !selected;
      });
    };

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => activateTab(btn));
    });
    tabsWrap?.addEventListener('keydown', (event) => {
      const current = tabBtns.findIndex((tab) => tab.classList.contains('active'));
      let next = current;
      if (event.key === 'ArrowRight') next = (current + 1) % tabBtns.length;
      if (event.key === 'ArrowLeft') next = (current - 1 + tabBtns.length) % tabBtns.length;
      if (next !== current) {
        event.preventDefault();
        activateTab(tabBtns[next]);
        tabBtns[next].focus();
      }
    });
    if (tabBtns[0]) activateTab(tabBtns.find((tab) => tab.classList.contains('active')) || tabBtns[0]);

    document.querySelectorAll('img').forEach((img, idx) => {
      if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
      if (!img.hasAttribute('loading') && idx > 0) img.setAttribute('loading', 'lazy');
    });
    document.querySelectorAll('.color-code').forEach((btn) => {
      btn.addEventListener('click', () => copyColor(btn.dataset.color || btn.textContent.trim()));
    });

    // Copy color code to clipboard
    function copyColor(code) {
      navigator.clipboard.writeText(code).then(() => {
        const toast = document.createElement('div');
        toast.textContent = `${code} copied!`;
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0b1b3a;color:#fff;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.2);';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      });
    }
  </script>
</body>
</html>
