<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="x-frame-options" content="allow" />
    <title>Upcoming Matches - BIS Athletics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary-color: #2563eb;
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --muted-surface: #f9fafb;
        --muted-border: #e5e7eb;
        --text-main: #1f2937;
        --text-sub: #6b7280;
        --nav-muted: rgba(15, 23, 42, 0.7);
        --win-color: #10b981;
        --draw-color: #9ca3af;
        --lose-color: #ef4444;
        --border-radius: 24px;
      }

      body.dark {
        --bg-color: #0b1220;
        --card-bg: #0f1724;
        --muted-surface: #071226;
        --muted-border: rgba(255,255,255,0.06);
        --text-main: #e6eef8;
        --text-sub: #9ca3af;
        --nav-muted: rgba(230, 238, 248, 0.8);
        --primary-color: #60a5fa;
        --win-color: #34d399;
        --draw-color: #64748b;
        --lose-color: #f87171;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0 !important; padding: 0 !important; border: 0 !important; }

      body {
        font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 24px 80px;
        position: relative;
      }

      .top-nav {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        font-weight: 700;
        color: var(--nav-muted);
        letter-spacing: 0.4px;
      }

      .nav-center {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        column-gap: 80px;
        margin: 0 auto;
        width: 100%;
      }

      .nav-left, .nav-right {
        display: flex;
        align-items: center;
        gap: 120px;
      }

      .nav-left { justify-content: flex-end; }
      .nav-right { justify-content: flex-start; }

      .top-nav .nav-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--nav-muted);
      }

      .top-nav .nav-item:hover, .top-nav .nav-item:focus { text-decoration: none; }

      .theme-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text-main);
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        backdrop-filter: blur(6px);
        transition: all 0.3s ease;
      }

      .theme-toggle:hover { transform: scale(1.02); }

      .theme-toggle-wrap {
        margin-top: 28px;
        display: flex;
        justify-content: center;
      }

      .top-nav .logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      .hero {
        text-align: center;
        margin-top: 28px;
      }

      .hero h1 {
        font-family: 'Black Han Sans', sans-serif;
        font-weight: 400;
        font-size: 52px;
        letter-spacing: 0.5px;
      }

      .hero .season {
        margin-top: 6px;
        color: var(--text-sub);
        font-weight: 600;
      }

      .content {
        max-width: 860px;
        margin: 30px auto 0;
      }

      .section-card {
        background: var(--card-bg);
        border-radius: 28px;
        padding: 28px 28px 10px;
        box-shadow: none;
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 12px;
      }
      .tab-btn {
        padding: 10px 24px;
        border-radius: 999px;
        border: 1px solid var(--muted-border);
        background: transparent;
        color: var(--text-main);
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
      }
      .tab-btn:hover:not(.active) {
        background: var(--muted-surface);
      }

      /* Sport Filter Tabs */
      .sport-tabs {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 18px;
      }
      .sport-tab {
        padding: 6px 16px;
        border-radius: 999px;
        border: 1px solid var(--muted-border);
        background: transparent;
        color: var(--text-sub);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .sport-tab.active {
        background: var(--text-main);
        color: var(--card-bg);
        border-color: var(--text-main);
      }
      .sport-tab:hover:not(.active) {
        background: var(--muted-surface);
      }

      /* Sport Badge */
      .sport-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .sport-badge.basketball {
        background: #f97316;
        color: #fff;
      }
      .sport-badge.volleyball {
        background: #8b5cf6;
        color: #fff;
      }
      .sport-badge.soccer {
        background: #22c55e;
        color: #fff;
      }

      /* Level Badge */
      .level-badge {
        display: none;
      }

      .search-bar {
        margin: 0 0 18px;
        display: flex;
        justify-content: center;
      }

      .search-input {
        width: 100%;
        max-width: 520px;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid var(--muted-border);
        background: var(--muted-surface);
        color: var(--text-main);
        font-size: 14px;
        font-weight: 600;
        margin: 0 auto;
        display: block;
      }

      .match-card {
        background: #ffffff;
        border-radius: 24px;
        padding: 24px;
        padding-top: 36px;
        margin-bottom: 20px;
        position: relative;
        box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
        cursor: pointer;
      }
      body.dark .match-card {
        background: var(--muted-surface);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.35);
      }

      .match-date {
        font-size: 13px;
        color: var(--text-sub);
        text-align: center;
        font-weight: 700;
        background: var(--card-bg);
        display: inline-block;
        padding: 6px 16px;
        border-radius: 999px;
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
      }

      .match-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }

      .team-vs {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 40%;
      }

      .team-vs img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        margin-bottom: 10px;
        background: #ffffff;
        padding: 10px;
        object-fit: cover;
        box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      }

      .team-vs span { font-weight: 800; font-size: 16px; }

      .vs-badge {
        font-size: 14px;
        font-weight: 900;
        color: #9ca3af;
        font-style: italic;
      }

      .match-location {
        font-size: 12px;
        color: var(--text-sub);
        text-align: center;
        margin-top: 6px;
      }

      .subscribe-btn {
        border: 1px solid var(--muted-border);
        background: var(--card-bg);
        color: var(--text-main);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        position: absolute;
        top: 12px;
        right: 12px;
        box-shadow: 0 6px 12px rgba(15, 23, 42, 0.08);
      }

      .subscribe-btn.active {
        background: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
      }

      .vote-section { margin-top: 18px; }

      .vote-btns {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 12px;
      }

      .vote-btn {
        padding: 12px 10px;
        border: 1px solid var(--muted-border);
        background: #fff;
        color: var(--text-sub);
        border-radius: 16px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        transition: all 0.2s;
      }

      .vote-btn:hover {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
      }

      .vote-btn[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .vote-btn.active {
        background: #7f9cf5;
        color: white;
        border-color: #7f9cf5;
        box-shadow: 0 10px 20px rgba(127, 156, 245, 0.35);
      }

      .vote-bar-container {
        height: 8px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        display: flex;
      }

      .vote-bar-left {
        height: 100%;
        background: #2563eb;
        width: 50%;
        transition: width 0.5s ease;
      }

      .vote-bar-mid {
        height: 100%;
        background: #9ca3af;
        width: 0%;
        transition: width 0.5s ease;
      }

      .vote-bar-right {
        height: 100%;
        background: #ef4444;
        width: 0%;
        transition: width 0.5s ease;
      }

      .vote-stats {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--text-sub);
        margin-top: 6px;
        font-weight: 700;
      }

      /* Final Score Display */
      .final-score {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin-top: 12px;
        font-size: 28px;
        font-weight: 900;
      }
      .final-score .score-home { color: var(--primary-color); }
      .final-score .score-away { color: var(--lose-color); }
      .final-score .score-sep { color: var(--text-sub); }

      .empty-msg {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-sub);
        font-weight: 600;
      }

      @media (max-width: 720px) {
        .top-nav { gap: 40px; }
        .nav-center { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
        .nav-left, .nav-right { gap: 24px; justify-content: center; }
        .theme-toggle { position: static; margin: 16px auto 0; }
        .match-content { flex-direction: column; gap: 12px; }
        .team-vs { width: 100%; }
        .vote-btns { grid-template-columns: 1fr; }
        .sport-tabs { flex-wrap: wrap; }
        .sport-tab { font-size: 12px; padding: 5px 12px; }
      }

      @media (max-width: 480px) {
        .wrap { padding: 12px 16px 60px; }
        .top-nav { gap: 20px; }
        .nav-center { gap: 16px; }
        .nav-left, .nav-right { gap: 16px; font-size: 14px; }
        .top-nav .logo { width: 40px; height: 40px; }
        .hero h1 { font-size: 36px; }
        .hero .season { font-size: 14px; }
        .content { margin-top: 20px; }
        .section-card { padding: 20px 16px 10px; border-radius: 20px; }
        .tabs { gap: 8px; }
        .tab-btn { padding: 8px 16px; font-size: 14px; }
        .sport-tabs { gap: 6px; }
        .sport-tab { font-size: 11px; padding: 4px 10px; }
        .search-input { padding: 8px 12px; font-size: 13px; }
        .match-card { padding: 18px 16px; padding-top: 32px; border-radius: 18px; margin-bottom: 16px; }
        .match-date { font-size: 12px; }
        .sport-badge { font-size: 9px; padding: 3px 8px; }
        .team-vs img { width: 56px; height: 56px; }
        .team-vs span { font-size: 14px; }
        .vs-badge { font-size: 12px; }
        .match-location { font-size: 11px; }
        .level-badge { font-size: 9px; }
        .subscribe-btn { padding: 6px 10px; font-size: 11px; }
        .vote-btn { padding: 8px; font-size: 13px; }
        .vote-stats { font-size: 11px; }
        .theme-toggle { padding: 6px 12px; font-size: 14px; }
      }

      @media (max-width: 360px) {
        .wrap { padding: 10px 12px 50px; }
        .nav-left, .nav-right { gap: 12px; font-size: 12px; }
        .top-nav .logo { width: 36px; height: 36px; }
        .hero h1 { font-size: 28px; }
        .hero .season { font-size: 12px; }
        .section-card { padding: 16px 12px 8px; border-radius: 16px; }
        .tabs { gap: 6px; }
        .tab-btn { padding: 6px 12px; font-size: 12px; }
        .sport-tabs { gap: 4px; }
        .sport-tab { font-size: 10px; padding: 3px 8px; }
        .search-input { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
        .match-card { padding: 14px 12px; padding-top: 28px; border-radius: 14px; margin-bottom: 14px; }
        .match-date { font-size: 11px; }
        .sport-badge { font-size: 8px; padding: 2px 6px; }
        .team-vs img { width: 40px; height: 40px; }
        .team-vs span { font-size: 12px; }
        .vs-badge { font-size: 10px; }
        .match-location { font-size: 10px; }
        .level-badge { font-size: 8px; }
        .subscribe-btn { padding: 5px 8px; font-size: 10px; }
        .vote-btn { padding: 6px; font-size: 11px; }
        .vote-stats { font-size: 10px; }
        .theme-toggle { padding: 5px 10px; font-size: 12px; }
      }

      /* iframe 임베드 지원 */
      html.in-iframe, html.in-iframe body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      html.in-iframe .wrap {
        max-width: 100%;
        padding: 12px 16px 24px;
      }
    </style>
    <script>
      // iframe 감지 및 클래스 추가
      (function() {
        try {
          if (window.self !== window.top || window.frameElement) {
            document.documentElement.classList.add('in-iframe');
          }
        } catch (e) {
          document.documentElement.classList.add('in-iframe');
        }
      })();
    </script>
  </head>

        const basePath = path.endsWith('/') ? path : (hasExt ? path.replace(/\/[^/]*$/, '/') : path + '/');

        { id: 13, home: 'BIS', away: 'SPPS', date: 'Feb 28, 4:30pm', location: 'BIS', sport: 'volleyball', level: 'MS', gender: 'Boys/Girls' },
        
        // Soccer Games (Spring)
        { id: 14, home: 'BIS', away: 'CMIS', date: 'Mar 12, 2:30pm', location: 'BIS Respia', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 15, home: 'BIS', away: 'CCAS', date: 'Mar 18, 4:30pm', location: 'CCAS', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 17, home: 'BIS', away: 'SALT', date: 'Mar 25', location: 'TBD', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 18, home: 'BIS', away: 'ICSU', date: 'Apr 7, 4:30pm', location: 'ICSU', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 19, home: 'BIS', away: 'ICSP', date: 'Apr 8', location: 'TBD', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 20, home: 'BIS', away: 'ICSP', date: 'Apr 11, 3:45pm', location: 'ICSP', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 21, home: 'BIS', away: 'SPPS', date: 'Apr 15, 4:20pm', location: 'Gangnam', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 22, home: 'BIS', away: 'CCAS', date: 'Apr 17, 4:30pm', location: 'Songpa', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 24, home: 'BIS', away: 'FPS', date: 'Apr 23, 2:30pm', location: 'RESPIA', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 26, home: 'BIS', away: 'HEXA Cup', date: 'Apr 26', location: 'hexacup.com', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 27, home: 'BIS', away: 'SPAD', date: 'May 8, 4:15pm', location: 'RESPIA', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 29, home: 'BIS', away: 'Chadwick JV', date: 'May 13, 4:30pm', location: 'Chadwick', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 30, home: 'BIS', away: 'CCAS', date: 'May 15, 4:00pm', location: 'Songpa', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 32, home: 'BIS', away: 'SSI', date: 'May 20, 5:00pm', location: 'Daechi', sport: 'soccer', level: 'HS', gender: 'Men' },
        { id: 34, home: 'BIS', away: 'CSIS', date: 'May 29, 4:15pm', location: 'RESPIA', sport: 'soccer', level: 'HS', gender: 'Men' }
      ];

      const MATCH_SUB_KEY = 'kisvl_match_subscriptions';
      const VOTES_KEY = 'kisvl_votes';
      const VOTE_COUNTS_KEY = 'kisvl_vote_counts';
      const FINISHED_KEY = 'kisvl_finished_matches';

      const firebaseConfig = window.BIS_FIREBASE_CONFIG || {};
      const hasFirebaseConfig = !!firebaseConfig && !!firebaseConfig.apiKey;
      let useFirebase = false;
      let db = null;
      let voteCountsCache = {};
      let finishedMatchesCache = {};

      let searchQuery = '';

      const normalizeText = (value) => (value || '').toString().trim().toLowerCase();
      const matchesQuery = (...fields) => {
        if (!searchQuery) return true;
        const haystack = fields.map(normalizeText).join(' ');
        return haystack.includes(searchQuery);
      };

      const getSubs = () => {
        try { return JSON.parse(localStorage.getItem(MATCH_SUB_KEY) || '{}'); } catch (e) { return {}; }
      };
      const setSubs = (data) => {
        try { localStorage.setItem(MATCH_SUB_KEY, JSON.stringify(data)); } catch (e) {}
      };
      const isMatchSubscribed = (matchId) => !!getSubs()[matchId];

      const getVotes = () => {
        try { return JSON.parse(localStorage.getItem(VOTES_KEY) || '{}'); } catch (e) { return {}; }
      };
      const hasVoted = (matchId) => !!getVotes()[matchId];
      const getVote = (matchId) => getVotes()[matchId] || null;
      const storeVote = (matchId, choice) => {
        try {
          const v = getVotes();
          v[matchId] = choice;
          localStorage.setItem(VOTES_KEY, JSON.stringify(v));
        } catch (e) {}
      };

      const getVoteCounts = () => {
        try { return JSON.parse(localStorage.getItem(VOTE_COUNTS_KEY) || '{}'); } catch (e) { return {}; }
      };
      const setVoteCounts = (all) => {
        try { localStorage.setItem(VOTE_COUNTS_KEY, JSON.stringify(all)); } catch (e) {}
      };
      const getCountsForMatch = (matchId) => {
        if (useFirebase) return voteCountsCache[matchId] || { home: 0, draw: 0, away: 0 };
        return getVoteCounts()[matchId] || { home: 0, draw: 0, away: 0 };
      };
      const setCountsForMatch = (matchId, counts) => {
        const all = getVoteCounts();
        all[matchId] = counts;
        setVoteCounts(all);
      };

      // Finished matches
      const getFinishedLocal = () => {
        try { return JSON.parse(localStorage.getItem(FINISHED_KEY) || '{}'); } catch (e) { return {}; }
      };
      const setFinishedLocal = (data) => {
        try { localStorage.setItem(FINISHED_KEY, JSON.stringify(data)); } catch (e) {}
      };
      const isMatchFinished = (matchId) => {
        if (useFirebase) return !!finishedMatchesCache[matchId];
        return !!getFinishedLocal()[matchId];
      };
      const getMatchResult = (matchId) => {
        if (useFirebase) return finishedMatchesCache[matchId] || null;
        return getFinishedLocal()[matchId] || null;
      };

      const listenVoteCountsFirebase = () => {
        if (!db) return;
        db.collection('votes').onSnapshot((snap) => {
          const all = {};
          snap.forEach((doc) => { all[doc.id] = doc.data() || {}; });
          voteCountsCache = all;
          renderSchedule();
        });
      };

      const listenFinishedMatchesFirebase = () => {
        if (!db) return;
        db.collection('finishedMatches').onSnapshot((snap) => {
          const all = {};
          snap.forEach((doc) => { all[doc.id] = doc.data() || {}; });
          finishedMatchesCache = all;
          renderSchedule();
        });
      };

      const initFirebaseIfConfigured = () => {
        if (!hasFirebaseConfig || !window.firebase || !firebase.initializeApp) return false;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          useFirebase = true;
          listenVoteCountsFirebase();
          listenFinishedMatchesFirebase();
          return true;
        } catch (e) {
          console.warn('Firebase init failed, falling back to localStorage.', e);
          useFirebase = false;
          db = null;
          return false;
        }
      };

      const voteRemote = async (matchId, side) => {
        if (!db || !firebase?.firestore?.FieldValue) return;
        const ref = db.collection('votes').doc(String(matchId));
        const field = side === 'home' ? 'home' : side === 'away' ? 'away' : 'draw';
        const inc = firebase.firestore.FieldValue.increment(1);
        await db.runTransaction(async (tx) => {
          tx.set(ref, { [field]: inc }, { merge: true });
        });
      };

      // Admin: finish match
      const finishMatchRemote = async (matchId, homeScore, awayScore) => {
        if (!db) return;
        const ref = db.collection('finishedMatches').doc(String(matchId));
        await ref.set({ finished: true, homeScore, awayScore, finishedAt: new Date().toISOString() });
      };

      const resetMatchRemote = async (matchId) => {
        if (!db) return;
        const ref = db.collection('finishedMatches').doc(String(matchId));
        await ref.delete();
      };

      const finishMatchLocal = (matchId, homeScore, awayScore) => {
        const data = getFinishedLocal();
        data[matchId] = { finished: true, homeScore, awayScore, finishedAt: new Date().toISOString() };
        setFinishedLocal(data);
      };

      const resetMatchLocal = (matchId) => {
        const data = getFinishedLocal();
        delete data[matchId];
        setFinishedLocal(data);
      };

      const formatMatchDate = (raw) => {
        if (!raw || typeof raw !== 'string') return 'TBD';
        const monthDayMatch = raw.match(/([A-Za-z]{3,9}\s*\d{1,2})/);
        const timeMatch = raw.match(/(\d{1,2}:\d{2}\s*(?:am|pm|AM|PM)?)/i);
        if (monthDayMatch && timeMatch) return (monthDayMatch[1].trim() + ' ' + timeMatch[1].toLowerCase());
        if (monthDayMatch) return monthDayMatch[1].trim();
        if (timeMatch) return timeMatch[1].toLowerCase();
        return 'TBD';
      };

      const renderSchedule = () => {
        const container = document.getElementById('scheduleList');
        if (!container) return;
        container.innerHTML = '';

        const filteredMatches = schedules.filter(match => {
          const finished = isMatchFinished(match.id);
          if (currentTab === 'upcoming' && finished) return false;
          if (currentTab === 'past' && !finished) return false;
          if (currentSport !== 'all' && match.sport !== currentSport) return false;
          return matchesQuery(match.home, match.away, match.location, match.date, match.sport, match.level, match.gender);
        });

        if (filteredMatches.length === 0) {
          container.innerHTML = `<div class="empty-msg">${currentTab === 'upcoming' ? '예정된 경기가 없습니다' : '종료된 경기가 없습니다'}</div>`;
          return;
        }

        filteredMatches.forEach(match => {
          const homeTeam = teams.find(t => t.name === match.home) || { name: match.home, logo: placeholderLogo };
          const awayTeam = teams.find(t => t.name === match.away) || { name: match.away, logo: placeholderLogo };
          const finished = isMatchFinished(match.id);
          const result = getMatchResult(match.id);

          const counts = getCountsForMatch(match.id);
          const homeVotes = Number(counts.home || 0);
          const drawVotes = Number(counts.draw || 0);
          const awayVotes = Number(counts.away || 0);
          const totalVotes = homeVotes + drawVotes + awayVotes;
          const homePercent = totalVotes === 0 ? 33 : Math.round((homeVotes / totalVotes) * 100);
          const drawPercent = totalVotes === 0 ? 33 : Math.round((drawVotes / totalVotes) * 100);
          const awayPercent = totalVotes === 0 ? 34 : Math.max(0, 100 - homePercent - drawPercent);

          const votedChoice = getVote(match.id);
          const displayDate = formatMatchDate(match.date);

          const card = document.createElement('div');
          card.className = 'match-card';
          card.id = `match-${match.id}`;
          card.dataset.matchId = match.id;
          card.dataset.detail = `details.html?id=${match.id}`;

          const subscribed = isMatchSubscribed(match.id);
          const subscribeIcon = subscribed ? '🔔' : '🔕';

          // Sport badge
          const sportEmoji = match.sport === 'basketball' ? '🏀' : match.sport === 'volleyball' ? '🏐' : '⚽';
          const sportLabel = match.sport === 'basketball' ? 'Basketball' : match.sport === 'volleyball' ? 'Volleyball' : 'Soccer';

          let scoreHtml = '';
          if (finished && result) {
            scoreHtml = `
              <div class="final-score">
                <span class="score-home">${result.homeScore}</span>
                <span class="score-sep">-</span>
                <span class="score-away">${result.awayScore}</span>
              </div>
            `;
          }

          let voteHtml = '';
          if (!finished) {
            voteHtml = `
              <div class="vote-section">
                <div class="vote-btns">
                  <button class="vote-btn ${votedChoice === 'home' ? 'active' : ''}" onclick="vote(${match.id}, 'home')" ${votedChoice ? 'disabled' : ''}>Vote ${homeTeam.name}</button>
                  <button class="vote-btn ${votedChoice === 'draw' ? 'active' : ''}" onclick="vote(${match.id}, 'draw')" ${votedChoice ? 'disabled' : ''}>Vote Draw</button>
                  <button class="vote-btn ${votedChoice === 'away' ? 'active' : ''}" onclick="vote(${match.id}, 'away')" ${votedChoice ? 'disabled' : ''}>Vote ${awayTeam.name}</button>
                </div>
                <div class="vote-bar-container">
                  <div class="vote-bar-left" style="width: ${homePercent}%"></div>
                  <div class="vote-bar-mid" style="width: ${drawPercent}%"></div>
                  <div class="vote-bar-right" style="width: ${awayPercent}%"></div>
                </div>
                <div class="vote-stats">
                  <span>${homePercent}%</span>
                  <span>${drawPercent}%</span>
                  <span>${awayPercent}%</span>
                </div>
              </div>
            `;
          }

          // Level info
          const levelInfo = match.level ? `${match.level}` : '';
          const genderInfo = match.gender ? ` · ${match.gender}` : '';

          card.innerHTML = `
            <span class="sport-badge ${match.sport}">${sportEmoji} ${sportLabel}</span>
            <div class="match-date">${displayDate}</div>
            <button class="subscribe-btn match-subscribe ${subscribed ? 'active' : ''}" data-match="${match.id}" aria-pressed="${subscribed}">${subscribeIcon}</button>
            <div class="match-content">
              <div class="team-vs">
                <img src="${homeTeam.logo}" alt="${homeTeam.name}" class="team-logo">
                <span>${homeTeam.name}</span>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span class="vs-badge">VS</span>
                <div class="match-location">${match.location || ''}</div>
              </div>
              <div class="team-vs">
                <img src="${awayTeam.logo}" alt="${awayTeam.name}" class="team-logo">
                <span>${awayTeam.name}</span>
              </div>
            </div>
            ${scoreHtml}
            ${voteHtml}
          `;
          container.appendChild(card);
        });
      };

      const vote = async (matchId, side) => {
        const match = schedules.find(m => m.id === matchId);
        if (!match) return;
        if (hasVoted(matchId)) return;
        if (useFirebase) {
          try {
            await voteRemote(matchId, side);
            storeVote(matchId, side);
          } catch (e) {
            console.warn('Remote vote failed, falling back to localStorage.', e);
            const counts = getCountsForMatch(matchId);
            if (side === 'home') counts.home = (counts.home || 0) + 1;
            else if (side === 'away') counts.away = (counts.away || 0) + 1;
            else if (side === 'draw') counts.draw = (counts.draw || 0) + 1;
            setCountsForMatch(matchId, counts);
            storeVote(matchId, side);
            renderSchedule();
          }
        } else {
          const counts = getCountsForMatch(matchId);
          if (side === 'home') counts.home = (counts.home || 0) + 1;
          else if (side === 'away') counts.away = (counts.away || 0) + 1;
          else if (side === 'draw') counts.draw = (counts.draw || 0) + 1;
          setCountsForMatch(matchId, counts);
          storeVote(matchId, side);
          renderSchedule();
        }
      };

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = btn.dataset.tab;
          renderSchedule();
        });
      });

      // Sport filter switching
      document.querySelectorAll('.sport-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.sport-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSport = btn.dataset.sport;
          renderSchedule();
        });
      });

      // Subscribe button
      document.addEventListener('click', async (event) => {
        const matchBtn = event.target.closest('.match-subscribe');
        if (!matchBtn) return;
        event.stopPropagation();
        const id = Number(matchBtn.dataset.match);
        const subs = getSubs();
        const wasSubscribed = !!subs[id];
        subs[id] = !wasSubscribed;
        setSubs(subs);
        renderSchedule();
      });

      // Card click -> detail page
      document.addEventListener('click', (event) => {
        const card = event.target.closest('.match-card');
        if (!card) return;
        if (event.target.closest('button, a, input, textarea, select')) return;
        const detailUrl = card.dataset.detail || `details.html?id=${card.dataset.matchId || ''}`;
        if (!detailUrl) return;
        window.location.href = detailUrl;
      });

      // Search
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (event) => {
          searchQuery = normalizeText(event.target.value);
          renderSchedule();
        });
      }

      // Init Firebase and render
      const firebaseReady = initFirebaseIfConfigured();
      if (!firebaseReady) {
        renderSchedule();
      }

      // Theme toggle
      (function(){
        const toggleButton = document.querySelector('.theme-toggle');
        if(!toggleButton) return;
        const toggleIcon = document.querySelector('.toggle-icon');
        const toggleText = document.querySelector('.toggle-text');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        const applyTheme = (theme) => {
          document.body.classList.toggle('dark', theme === 'dark');
          document.body.classList.toggle('light', theme === 'light');
          const isDark = theme === 'dark';
          toggleButton.setAttribute('aria-pressed', String(isDark));
          toggleIcon.textContent = isDark ? '☀️' : '🌙';
          toggleText.textContent = isDark ? 'Light' : 'Dark';
        };
        const savedTheme = localStorage.getItem('bis-theme');
        if(savedTheme){ applyTheme(savedTheme); } else { applyTheme(prefersDark.matches ? 'dark' : 'light'); }
        prefersDark.addEventListener('change', (e)=>{ if(!localStorage.getItem('bis-theme')) applyTheme(e.matches ? 'dark' : 'light'); });
        toggleButton.addEventListener('click', ()=>{ const isDark = document.body.classList.contains('dark'); const next = isDark ? 'light' : 'dark'; localStorage.setItem('bis-theme', next); applyTheme(next); });
      })();
    </script>
  </body>
</html>
