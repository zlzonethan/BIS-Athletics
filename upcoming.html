<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-frame-options" content="allow" />
    <title>Upcoming Matches - BIS Athletics</title>
    <link rel="icon" type="image/png" href="assets/bismascot.png" />
    <meta name="description" content="Check upcoming and completed BIS Athletics matches, sport filters, and vote status." />
    <link rel="canonical" href="https://bis-athletics.web.app/upcoming.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Upcoming Matches - BIS Athletics" />
    <meta property="og:description" content="Check upcoming and completed BIS Athletics matches, sport filters, and vote status." />
    <meta property="og:url" content="https://bis-athletics.web.app/upcoming.html" />
    <meta property="og:image" content="https://bis-athletics.web.app/assets/bismascot.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Upcoming Matches - BIS Athletics" />
    <meta name="twitter:description" content="Check upcoming and completed BIS Athletics matches, sport filters, and vote status." />
    <meta name="twitter:image" content="https://bis-athletics.web.app/assets/bismascot.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary-color: #2563eb;
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --muted-surface: #f9fafb;
        --muted-border: #e5e7eb;
        --text-main: #1f2937;
        --text-sub: #6b7280;
        --nav-muted: rgba(15, 23, 42, 0.7);
        --win-color: #10b981;
        --draw-color: #9ca3af;
        --lose-color: #ef4444;
        --border-radius: 24px;
      }

      body.dark {
        --bg-color: #0b1220;
        --card-bg: #0f1724;
        --muted-surface: #071226;
        --muted-border: rgba(255,255,255,0.06);
        --text-main: #e6eef8;
        --text-sub: #9ca3af;
        --nav-muted: rgba(230, 238, 248, 0.8);
        --primary-color: #60a5fa;
        --win-color: #34d399;
        --draw-color: #64748b;
        --lose-color: #f87171;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0 !important; padding: 0 !important; border: 0 !important; }
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }

      body {
        font-family: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 24px calc(80px + env(safe-area-inset-bottom));
        position: relative;
      }

      .top-nav {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        font-weight: 700;
        color: var(--nav-muted);
        letter-spacing: 0.4px;
      }

      .nav-center {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        column-gap: 80px;
        margin: 0 auto;
        width: 100%;
      }

      .nav-left, .nav-right {
        display: flex;
        align-items: center;
        gap: 120px;
      }

      .nav-left { justify-content: flex-end; }
      .nav-right { justify-content: flex-start; }

      .top-nav .nav-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--nav-muted);
        text-decoration: none;
      }

      .top-nav .nav-item:hover, .top-nav .nav-item:focus { text-decoration: none; }

      .theme-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text-main);
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        backdrop-filter: blur(6px);
        transition: all 0.3s ease;
      }

      .theme-toggle:hover { transform: scale(1.02); }

      .theme-toggle-wrap {
        margin-top: 28px;
        display: flex;
        justify-content: center;
      }

      .top-nav .logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      .hero {
        text-align: center;
        margin-top: 28px;
      }

      .hero h1 {
        font-family: 'Black Han Sans', sans-serif;
        font-weight: 400;
        font-size: 52px;
        letter-spacing: 0.5px;
      }

      .hero .season {
        margin-top: 6px;
        color: var(--text-sub);
        font-weight: 600;
      }

      .content {
        max-width: 860px;
        margin: 30px auto 0;
      }

      .section-card {
        background: var(--card-bg);
        border-radius: 28px;
        padding: 28px 28px 10px;
        box-shadow: none;
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 12px;
      }
      .tab-btn {
        padding: 10px 24px;
        min-height: 44px;
        border-radius: 999px;
        border: 1px solid var(--muted-border);
        background: transparent;
        color: var(--text-main);
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
      }
      .tab-btn:hover:not(.active) {
        background: var(--muted-surface);
      }

      /* Sport Filter Tabs */
      .sport-tabs {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 18px;
      }
      .sport-tab {
        padding: 6px 16px;
        min-height: 40px;
        border-radius: 999px;
        border: 1px solid var(--muted-border);
        background: transparent;
        color: var(--text-sub);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .sport-tab.active {
        background: var(--text-main);
        color: var(--card-bg);
        border-color: var(--text-main);
      }
      .sport-tab:hover:not(.active) {
        background: var(--muted-surface);
      }

      /* Sport Badge */
      .sport-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .sport-badge.basketball {
        background: #f97316;
        color: #fff;
      }
      .sport-badge.volleyball {
        background: #8b5cf6;
        color: #fff;
      }
      .sport-badge.soccer {
        background: #22c55e;
        color: #fff;
      }

      /* Level Badge */
      .level-badge {
        display: none;
      }

      .search-bar {
        margin: 0 0 18px;
        display: flex;
        justify-content: center;
      }
      .filters-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
        margin: 0 0 14px;
        flex-wrap: wrap;
      }
      .filter-select {
        min-height: 40px;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid var(--muted-border);
        background: var(--muted-surface);
        color: var(--text-main);
        font-size: 13px;
        font-weight: 700;
      }
      .clear-filter-btn {
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 12px;
        border: 1px solid var(--muted-border);
        background: transparent;
        color: var(--text-main);
        font-weight: 700;
        cursor: pointer;
      }

      .search-input {
        width: 100%;
        max-width: 520px;
        padding: 10px 14px;
        min-height: 44px;
        border-radius: 14px;
        border: 1px solid var(--muted-border);
        background: var(--muted-surface);
        color: var(--text-main);
        font-size: 14px;
        font-weight: 600;
        margin: 0 auto;
        display: block;
      }

      .match-card {
        background: #ffffff;
        border-radius: 24px;
        padding: 24px;
        padding-top: 36px;
        margin-bottom: 20px;
        position: relative;
        box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
        cursor: pointer;
      }
      body.dark .match-card {
        background: var(--muted-surface);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.35);
      }

      .match-date {
        font-size: 13px;
        color: var(--text-sub);
        text-align: center;
        font-weight: 700;
        background: var(--card-bg);
        display: inline-block;
        padding: 6px 16px;
        border-radius: 999px;
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
      }

      .match-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }

      .team-vs {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 40%;
      }

      .team-vs img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        margin-bottom: 10px;
        background: #ffffff;
        padding: 10px;
        object-fit: cover;
        box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      }

      .team-vs span { font-weight: 800; font-size: 16px; }

      .vs-badge {
        font-size: 14px;
        font-weight: 900;
        color: #9ca3af;
        font-style: italic;
      }

      .match-location {
        font-size: 12px;
        color: var(--text-sub);
        text-align: center;
        margin-top: 6px;
      }
      .match-meta {
        font-size: 11px;
        color: var(--text-sub);
        text-align: center;
        margin-top: 4px;
        font-weight: 700;
      }

      .subscribe-btn {
        border: 1px solid var(--muted-border);
        background: var(--card-bg);
        color: var(--text-main);
        border-radius: 999px;
        padding: 6px 10px;
        min-height: 34px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        position: absolute;
        top: 12px;
        right: 12px;
        box-shadow: 0 6px 12px rgba(15, 23, 42, 0.08);
      }

      .subscribe-btn.active {
        background: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
      }

      .vote-section { margin-top: 18px; }

      .vote-btns {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 12px;
      }

      .vote-btn {
        padding: 12px 10px;
        min-height: 44px;
        border: 1px solid var(--muted-border);
        background: #fff;
        color: var(--text-sub);
        border-radius: 16px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        transition: all 0.2s;
      }

      .vote-btn:hover {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
      }

      .vote-btn[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .vote-btn.active {
        background: #7f9cf5;
        color: white;
        border-color: #7f9cf5;
        box-shadow: 0 10px 20px rgba(127, 156, 245, 0.35);
      }

      .vote-bar-container {
        height: 8px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        display: flex;
      }

      .vote-bar-left {
        height: 100%;
        background: #2563eb;
        width: 50%;
        transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: width;
      }

      .vote-bar-mid {
        height: 100%;
        background: #9ca3af;
        width: 0%;
        transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: width;
      }

      .vote-bar-right {
        height: 100%;
        background: #ef4444;
        width: 0%;
        transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: width;
      }

      .vote-stats {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--text-sub);
        margin-top: 6px;
        font-weight: 700;
      }

      /* Final Score Display */
      .final-score {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin-top: 12px;
        font-size: 28px;
        font-weight: 900;
      }
      .final-score .score-home { color: var(--primary-color); }
      .final-score .score-away { color: var(--lose-color); }
      .final-score .score-sep { color: var(--text-sub); }

      .empty-msg {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-sub);
        font-weight: 600;
      }
      .empty-actions {
        margin-top: 12px;
        display: flex;
        justify-content: center;
      }
      .empty-reset-btn {
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 12px;
        border: 1px solid var(--muted-border);
        background: var(--card-bg);
        color: var(--text-main);
        font-weight: 800;
        cursor: pointer;
      }
      .vote-toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
        pointer-events: none;
        background: rgba(15, 23, 42, 0.9);
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 999px;
        z-index: 99999;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      .vote-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      @keyframes votedPulse {
        0% { transform: scale(1); box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08); }
        50% { transform: scale(1.01); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2), 0 14px 30px rgba(15, 23, 42, 0.14); }
        100% { transform: scale(1); box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08); }
      }
      .match-card.voted-flash {
        animation: votedPulse 500ms ease;
      }

      @media (max-width: 860px) {
        .top-nav { gap: 40px; }
        .nav-center {
          display: flex;
          gap: 32px;
          flex-wrap: wrap;
          justify-content: center;
        }
        .nav-left, .nav-right {
          gap: 24px;
          justify-content: center;
        }
        .theme-toggle {
          position: static;
          margin: 16px auto 0;
          min-height: 44px;
          padding: 8px 14px;
        }
        .hero { margin-top: 18px; }
        .hero h1 { font-size: clamp(32px, 10vw, 44px); }
        .content { margin-top: 18px; }
        .section-card { padding: 14px 12px 8px; border-radius: 18px; }

        .tabs, .sport-tabs {
          justify-content: flex-start;
          flex-wrap: nowrap;
          overflow-x: auto;
          padding: 2px 2px 8px;
          scrollbar-width: thin;
          -webkit-overflow-scrolling: touch;
        }
        .tab-btn, .sport-tab {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .search-bar { margin-bottom: 14px; }
        .search-input {
          max-width: 100%;
          font-size: 16px;
        }

        .match-card {
          padding: 16px 12px;
          padding-top: 30px;
          margin-bottom: 14px;
          border-radius: 16px;
        }
        .match-date {
          top: -12px;
          font-size: 11px;
          padding: 5px 12px;
        }
        .sport-badge {
          top: 10px;
          left: 10px;
          font-size: 10px;
        }
        .subscribe-btn {
          top: 8px;
          right: 8px;
          font-size: 11px;
          padding: 5px 9px;
        }
        .match-content {
          margin-top: 8px;
          gap: 8px;
        }
        .team-vs {
          width: 40%;
        }
        .team-vs img {
          width: 52px;
          height: 52px;
          padding: 6px;
          margin-bottom: 6px;
        }
        .team-vs span { font-size: 13px; }
        .vs-badge { font-size: 12px; }
        .match-location { font-size: 11px; margin-top: 4px; }

        .vote-section { margin-top: 12px; }
        .vote-btns { gap: 8px; margin-bottom: 8px; }
        .vote-btn {
          font-size: 12px;
          padding: 9px 8px;
        }
        .final-score {
          margin-top: 8px;
          font-size: 22px;
          gap: 10px;
        }
      }

      @media (max-width: 600px) {
        .wrap { padding: 12px 16px 60px; }
        .top-nav { gap: 20px; }
        .nav-center { gap: 16px; }
        .nav-left, .nav-right { gap: 16px; font-size: 14px; }
        .top-nav .logo { width: 40px; height: 40px; }
        .hero h1 { font-size: 32px; }
        .hero .season { font-size: 14px; }
        .content { margin-top: 20px; }
        .section-card { padding: 12px 10px 8px; border-radius: 16px; }
        .tabs { gap: 8px; }
        .tab-btn { padding: 8px 14px; font-size: 13px; }
        .sport-tabs { gap: 6px; }
        .sport-tab { font-size: 11px; padding: 4px 10px; min-height: 36px; }
        .search-input { padding: 8px 12px; font-size: 16px; }
        .match-card { padding: 14px 10px; padding-top: 30px; border-radius: 14px; margin-bottom: 12px; }
        .match-date { font-size: 12px; }
        .sport-badge { font-size: 9px; padding: 3px 8px; }
        .team-vs img { width: 48px; height: 48px; }
        .team-vs span { font-size: 12px; }
        .vs-badge { font-size: 12px; }
        .match-location { font-size: 11px; }
        .level-badge { font-size: 9px; }
        .subscribe-btn { padding: 6px 10px; font-size: 11px; }
        .vote-btn { padding: 8px; font-size: 13px; }
        .vote-stats { font-size: 11px; }
        .theme-toggle { padding: 6px 12px; font-size: 14px; }
      }

      @media (max-width: 360px) {
        .wrap { padding: 10px 12px 50px; }
        .nav-left, .nav-right { gap: 4px; font-size: 12px; }
        .top-nav .logo { width: 36px; height: 36px; }
        .hero h1 { font-size: 28px; }
        .hero .season { font-size: 12px; }
        .section-card { padding: 16px 12px 8px; border-radius: 16px; }
        .tabs { gap: 6px; }
        .tab-btn { padding: 6px 12px; font-size: 12px; }
        .sport-tabs { gap: 4px; }
        .sport-tab { font-size: 10px; padding: 3px 8px; }
        .search-input { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
        .match-card { padding: 14px 12px; padding-top: 28px; border-radius: 14px; margin-bottom: 14px; }
        .match-date { font-size: 11px; }
        .sport-badge { font-size: 8px; padding: 2px 6px; }
        .team-vs img { width: 40px; height: 40px; }
        .team-vs span { font-size: 12px; }
        .vs-badge { font-size: 10px; }
        .match-location { font-size: 10px; }
        .level-badge { font-size: 8px; }
        .subscribe-btn { padding: 5px 8px; font-size: 10px; }
        .vote-btn { padding: 6px; font-size: 11px; }
        .vote-stats { font-size: 10px; }
        .theme-toggle { padding: 5px 10px; font-size: 12px; }
      }

      /* iframe embed support */
      html.in-iframe, html.in-iframe body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      html.in-iframe .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 16px 24px;
      }
      html.in-iframe body {
        -webkit-text-size-adjust: 100%;
      }
    </style>
    <script>
      // Detect iframe and add class
      (function() {
        try {
          if (window.self !== window.top || window.frameElement) {
            document.documentElement.classList.add('in-iframe');
          }
        } catch (e) {
          document.documentElement.classList.add('in-iframe');
        }
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <nav class="top-nav">
        <div class="nav-center">
          <div class="nav-left">
            <a class="nav-item" href="bobcat.html">Bobcat</a>
            <a class="nav-item" href="team.html">Team</a>
          </div>
          <a href="index.html" class="nav-logo-link"><img decoding="async" class="logo" src="assets/bismascot.png" alt="BIS mascot" /></a>
          <div class="nav-right">
            <a class="nav-item" href="upcoming.html">Upcoming</a>
            <a class="nav-item" href="kisaa-kaiac.html">KISAA/KAIAC</a>
          </div>
        </div>
      </nav>

      <header class="hero">
        <h1>Matches</h1>
        <div class="season">📅 Upcoming & Past Matches</div>
      </header>

      <section class="content section-card">
        <div class="tabs" role="tablist" aria-label="Match list sections">
          <button class="tab-btn active" role="tab" aria-selected="true" tabindex="0" data-tab="upcoming" type="button">Upcoming</button>
          <button class="tab-btn" role="tab" aria-selected="false" tabindex="-1" data-tab="past" type="button">Past</button>
        </div>
        <div class="sport-tabs" role="group" aria-label="Sport filter">
          <button class="sport-tab active" aria-pressed="true" data-sport="all" type="button">All</button>
          <button class="sport-tab" aria-pressed="false" data-sport="basketball" type="button">🏀 Basketball</button>
          <button class="sport-tab" aria-pressed="false" data-sport="volleyball" type="button">🏐 Volleyball</button>
          <button class="sport-tab" aria-pressed="false" data-sport="soccer" type="button">⚽ Soccer</button>
        </div>
        <div class="filters-row">
          <select id="levelFilter" class="filter-select" aria-label="Level filter">
            <option value="all">All Levels</option>
            <option value="HS">HS</option>
            <option value="MS">MS</option>
          </select>
          <select id="genderFilter" class="filter-select" aria-label="Gender filter">
            <option value="all">All Genders</option>
            <option value="girls">Girls</option>
            <option value="boys">Boys</option>
          </select>
          <button id="clearFiltersBtnTop" class="clear-filter-btn" type="button">Reset Filters</button>
        </div>
        <div class="search-bar">
          <input id="searchInput" class="search-input" type="search" list="searchSuggestions" placeholder="Search team / match / location" aria-label="Search" />
          <datalist id="searchSuggestions"></datalist>
        </div>
        <div id="scheduleList"></div>
      </section>

      <div class="theme-toggle-wrap">
        <button class="theme-toggle" type="button" aria-pressed="false">
          <span class="toggle-icon">🌙</span>
          <span class="toggle-text">Dark</span>
        </button>
      </div>
    </div>

    <script>
      window.BIS_FIREBASE_CONFIG = {
        apiKey: "AIzaSyCzjMG7r_tweUGfznUnckpp_Xm4hF5119Q",
        authDomain: "bis-athletics.firebaseapp.com",
        projectId: "bis-athletics",
        storageBucket: "bis-athletics.firebasestorage.app",
        messagingSenderId: "759086332599",
        appId: "1:759086332599:web:4261b5aa076f0c60a0eb32",
        measurementId: "G-87M42WQKEQ"
      };
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="data/schedules.js"></script>
    <script>
      let currentTab = 'upcoming';
      let currentSport = 'all';
      let currentLevel = 'all';
      let currentGender = 'all';
      const RECENT_SEARCH_KEY = 'bis_recent_searches';
      let toastTimer = null;

      const getAssetBase = () => {
        const origin = window.location.origin;
        if (origin === 'null') return '';
        const path = window.location.pathname || '/';
        const hasExt = /\.[a-zA-Z0-9]+$/.test(path);
        const basePath = path.endsWith('/') ? path : (hasExt ? path.replace(/\/[^/]*$/, '/') : path + '/');
        const base = origin + basePath;
        return base.endsWith('/') ? base : base + '/';
      };

      const ASSET_BASE = getAssetBase();
      const assetUrl = (fileName) => `${ASSET_BASE}${fileName}`;

      const teams = [
        { id: 'bis', name: 'BIS', logo: assetUrl('assets/bismascot.png') },
        { id: 'spps', name: 'SPPS', logo: assetUrl('assets/sppsmascot.png') },
        { id: 'mica', name: 'MICA', logo: assetUrl('assets/micamascot.png') },
        { id: 'ccas', name: 'CCAS', logo: assetUrl('assets/ccasmascot.png') },
        { id: 'icsu', name: 'ICSU', logo: assetUrl('assets/icsumascot.png') },
        { id: 'spas', name: 'SPAS', logo: assetUrl('assets/spasmascot.png') },
        { id: 'fps', name: 'FPS', logo: assetUrl('assets/fpsmascot.jpeg') },
        { id: 'sie', name: 'SIE', logo: assetUrl('assets/siemascot.jpg') },
        { id: 'csis', name: 'CSIS', logo: assetUrl('assets/csismascot.png') },
        { id: 'gsis', name: 'GSIS', logo: assetUrl('assets/gsismascot.png') },
        { id: 'cmis', name: 'CMIS', logo: assetUrl('assets/cmismascot.png') },
        { id: 'bcc', name: 'BCC', logo: assetUrl('assets/bccmascot.png') },
        { id: 'salt', name: 'SALT', logo: assetUrl('assets/saltmascot.svg') },
        { id: 'chadwick', name: 'Chadwick JV', logo: assetUrl('assets/chadwickmascot.png') }
      ];

      const placeholderLogo = 'https://placehold.co/100x100/9CA3AF/ffffff?text=?';
      const CUSTOM_MATCHES_KEY = 'bis_custom_matches';
      const baseSchedules = Array.isArray(window.BIS_BASE_SCHEDULES)
        ? window.BIS_BASE_SCHEDULES.map((m) => ({ ...m }))
        : [];
      const sanitizeMatch = (match) => {
        const id = Number(match?.id);
        const home = (match?.home || '').toString().trim();
        const away = (match?.away || '').toString().trim();
        const date = (match?.date || '').toString().trim();
        if (!Number.isFinite(id) || !home || !away || !date) return null;
        return {
          id,
          home,
          away,
          date,
          location: (match?.location || '').toString().trim(),
          sport: (match?.sport || 'soccer').toString().trim().toLowerCase(),
          level: (match?.level || '').toString().trim(),
          gender: (match?.gender || '').toString().trim(),
          presetPast: !!match?.presetPast
        };
      };
      const getCustomMatchesLocal = () => {
        try {
          const raw = JSON.parse(localStorage.getItem(CUSTOM_MATCHES_KEY) || '[]');
          if (!Array.isArray(raw)) return [];
          return raw.map(sanitizeMatch).filter(Boolean);
        } catch (e) { return []; }
      };
      const setCustomMatchesLocal = (list) => {
        try { localStorage.setItem(CUSTOM_MATCHES_KEY, JSON.stringify(list || [])); } catch (e) {}
      };
      let customMatchesCache = getCustomMatchesLocal();
      const buildSchedules = () => {
        const all = [...baseSchedules, ...customMatchesCache];
        const seen = new Set();
        return all.filter((m) => {
          const id = Number(m?.id);
          if (!Number.isFinite(id) || seen.has(id)) return false;
          seen.add(id);
          return true;
        });
      };
      let schedules = buildSchedules();
      const PRESET_PAST_MATCH_IDS = new Set(baseSchedules.filter((m) => m?.presetPast).map((m) => Number(m.id)));

      const MATCH_SUB_KEY = 'bis_match_subscriptions';
      const VOTES_KEY = 'bis_votes';
      const VOTE_COUNTS_KEY = 'bis_vote_counts';
      const FINISHED_KEY = 'bis_finished_matches';

      const firebaseConfig = window.BIS_FIREBASE_CONFIG || {};
      const hasFirebaseConfig = !!firebaseConfig && !!firebaseConfig.apiKey;
      let useFirebase = false;
      let db = null;
      let voteCountsCache = {};
      let finishedMatchesCache = {};
      const lastVotePercents = {};

      let searchQuery = '';

      const normalizeText = (value) => (value || '').toString().trim().toLowerCase();
      const escapeHTML = (value) => (value || '').toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
      const normalizeSport = (sport) => {
        const s = normalizeText(sport);
        if (s === 'basketball' || s === 'volleyball' || s === 'soccer') return s;
        return 'soccer';
      };
      const matchesQuery = (...fields) => {
        if (!searchQuery) return true;
        const haystack = fields.map(normalizeText).join(' ');
        return haystack.includes(searchQuery);
      };
      const matchesGender = (matchGender, selected) => {
        if (selected === 'all') return true;
        const g = normalizeText(matchGender);
        if (selected === 'girls') return g.includes('girl') || g.includes('women');
        if (selected === 'boys') return g.includes('boy') || g.includes('men');
        return false;
      };
      const getRecentSearches = () => {
        try {
          const list = JSON.parse(localStorage.getItem(RECENT_SEARCH_KEY) || '[]');
          return Array.isArray(list) ? list.filter(Boolean) : [];
        } catch (e) { return []; }
      };
      const setRecentSearches = (list) => {
        try { localStorage.setItem(RECENT_SEARCH_KEY, JSON.stringify(list.slice(0, 8))); } catch (e) {}
      };
      const pushRecentSearch = (term) => {
        const q = normalizeText(term);
        if (!q) return;
        const next = [q, ...getRecentSearches().filter((v) => v !== q)];
        setRecentSearches(next);
      };
      const updateSearchSuggestions = () => {
        const dl = document.getElementById('searchSuggestions');
        if (!dl) return;
        const recent = getRecentSearches();
        dl.innerHTML = '';
        recent.forEach((q) => {
          const opt = document.createElement('option');
          opt.value = q;
          dl.appendChild(opt);
        });
      };
      const clearAllFilters = () => {
        currentSport = 'all';
        currentLevel = 'all';
        currentGender = 'all';
        searchQuery = '';
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        document.querySelectorAll('.sport-tab').forEach((b) => {
          const active = b.dataset.sport === 'all';
          b.classList.toggle('active', active);
          b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        const levelFilter = document.getElementById('levelFilter');
        const genderFilter = document.getElementById('genderFilter');
        if (levelFilter) levelFilter.value = 'all';
        if (genderFilter) genderFilter.value = 'all';
        renderSchedule();
      };
      const showToast = (message) => {
        let toast = document.getElementById('voteToast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'voteToast';
          toast.className = 'vote-toast';
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add('show');
        if (toastTimer) window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.classList.remove('show');
        }, 1300);
      };
      const pulseCard = (matchId) => {
        const card = document.getElementById(`match-${matchId}`);
        if (!card) return;
        card.classList.remove('voted-flash');
        void card.offsetWidth;
        card.classList.add('voted-flash');
      };

      const getSubs = () => {
        try { return JSON.parse(localStorage.getItem(MATCH_SUB_KEY) || '{}'); } catch (e) { return {}; }
      };
      const setSubs = (data) => {
        try { localStorage.setItem(MATCH_SUB_KEY, JSON.stringify(data)); } catch (e) {}
      };
      const isMatchSubscribed = (matchId) => !!getSubs()[matchId];

      const getVotes = () => {
        try { return JSON.parse(localStorage.getItem(VOTES_KEY) || '{}'); } catch (e) { return {}; }
      };
      const hasVoted = (matchId) => !!getVotes()[matchId];
      const getVote = (matchId) => getVotes()[matchId] || null;
      const storeVote = (matchId, choice) => {
        try {
          const v = getVotes();
          v[matchId] = choice;
          localStorage.setItem(VOTES_KEY, JSON.stringify(v));
        } catch (e) {}
      };

      const getVoteCounts = () => {
        try { return JSON.parse(localStorage.getItem(VOTE_COUNTS_KEY) || '{}'); } catch (e) { return {}; }
      };
      const setVoteCounts = (all) => {
        try { localStorage.setItem(VOTE_COUNTS_KEY, JSON.stringify(all)); } catch (e) {}
      };
      const getCountsForMatch = (matchId) => {
        if (useFirebase) return voteCountsCache[matchId] || { home: 0, draw: 0, away: 0 };
        return getVoteCounts()[matchId] || { home: 0, draw: 0, away: 0 };
      };
      const setCountsForMatch = (matchId, counts) => {
        const all = getVoteCounts();
        all[matchId] = counts;
        setVoteCounts(all);
      };

      // Finished matches
      const getFinishedLocal = () => {
        try { return JSON.parse(localStorage.getItem(FINISHED_KEY) || '{}'); } catch (e) { return {}; }
      };
      const setFinishedLocal = (data) => {
        try { localStorage.setItem(FINISHED_KEY, JSON.stringify(data)); } catch (e) {}
      };
      const isMatchFinished = (matchId) => {
        if (PRESET_PAST_MATCH_IDS.has(Number(matchId))) return true;
        const match = schedules.find((m) => Number(m.id) === Number(matchId));
        if (isAutoPastMatch(match)) return true;
        if (useFirebase) return !!finishedMatchesCache[matchId];
        return !!getFinishedLocal()[matchId];
      };
      const getMatchResult = (matchId) => {
        if (useFirebase) return finishedMatchesCache[matchId] || null;
        return getFinishedLocal()[matchId] || null;
      };

      const listenVoteCountsFirebase = () => {
        if (!db) return;
        db.collection('votes').onSnapshot((snap) => {
          const all = {};
          snap.forEach((doc) => { all[doc.id] = doc.data() || {}; });
          voteCountsCache = all;
          renderSchedule();
        });
      };

      const listenFinishedMatchesFirebase = () => {
        if (!db) return;
        db.collection('finishedMatches').onSnapshot((snap) => {
          const all = {};
          snap.forEach((doc) => { all[doc.id] = doc.data() || {}; });
          finishedMatchesCache = all;
          renderSchedule();
        });
      };

      const listenCustomMatchesFirebase = () => {
        if (!db) return;
        db.collection('customMatches').onSnapshot((snap) => {
          const list = [];
          snap.forEach((doc) => {
            const data = doc.data() || {};
            const normalized = sanitizeMatch({
              ...data,
              id: Number.isFinite(Number(data.id)) ? Number(data.id) : Number(doc.id)
            });
            if (normalized) list.push(normalized);
          });
          customMatchesCache = list;
          setCustomMatchesLocal(list);
          schedules = buildSchedules();
          renderSchedule();
        });
      };

      const initFirebaseIfConfigured = () => {
        if (!hasFirebaseConfig || !window.firebase || !firebase.initializeApp) return false;
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          useFirebase = true;
          listenVoteCountsFirebase();
          listenFinishedMatchesFirebase();
          listenCustomMatchesFirebase();
          return true;
        } catch (e) {
          console.warn('Firebase init failed, falling back to localStorage.', e);
          useFirebase = false;
          db = null;
          return false;
        }
      };

      const voteRemote = async (matchId, side) => {
        if (!db || !firebase?.firestore?.FieldValue) return;
        const ref = db.collection('votes').doc(String(matchId));
        const field = side === 'home' ? 'home' : side === 'away' ? 'away' : 'draw';
        const inc = firebase.firestore.FieldValue.increment(1);
        await db.runTransaction(async (tx) => {
          tx.set(ref, { [field]: inc }, { merge: true });
        });
      };

      // Admin: finish match
      const finishMatchRemote = async (matchId, homeScore, awayScore) => {
        if (!db) return;
        const ref = db.collection('finishedMatches').doc(String(matchId));
        await ref.set({ finished: true, homeScore, awayScore, finishedAt: new Date().toISOString() });
      };

      const resetMatchRemote = async (matchId) => {
        if (!db) return;
        const ref = db.collection('finishedMatches').doc(String(matchId));
        await ref.delete();
      };

      const finishMatchLocal = (matchId, homeScore, awayScore) => {
        const data = getFinishedLocal();
        data[matchId] = { finished: true, homeScore, awayScore, finishedAt: new Date().toISOString() };
        setFinishedLocal(data);
      };

      const resetMatchLocal = (matchId) => {
        const data = getFinishedLocal();
        delete data[matchId];
        setFinishedLocal(data);
      };

      const formatMatchDate = (raw) => {
        if (!raw || typeof raw !== 'string') return 'TBD';
        const monthDayMatch = raw.match(/([A-Za-z]{3,9}\s*\d{1,2})/);
        const timeMatch = raw.match(/(\d{1,2}:\d{2}\s*(?:am|pm|AM|PM)?)/i);
        if (monthDayMatch && timeMatch) return (monthDayMatch[1].trim() + ' ' + timeMatch[1].toLowerCase());
        if (monthDayMatch) return monthDayMatch[1].trim();
        if (timeMatch) return timeMatch[1].toLowerCase();
        return 'TBD';
      };

      const monthToIndex = (monthRaw) => {
        const key = (monthRaw || '').toString().trim().slice(0, 3).toLowerCase();
        const map = {
          jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
          jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
        };
        return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : null;
      };

      const parseMatchDay = (rawDate) => {
        if (!rawDate || typeof rawDate !== 'string') return null;
        const m = rawDate.match(/([A-Za-z]{3,9})\s*(\d{1,2})/);
        if (!m) return null;
        const monthIndex = monthToIndex(m[1]);
        const day = Number(m[2]);
        if (monthIndex === null || !Number.isFinite(day) || day < 1 || day > 31) return null;

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        let year = currentYear;

        // School-season year inference (fall -> spring rollover).
        if (currentMonth <= 4 && monthIndex >= 7) year = currentYear - 1;
        if (currentMonth >= 7 && monthIndex <= 4) year = currentYear + 1;

        return new Date(year, monthIndex, day);
      };

      const parseMatchDateTime = (rawDate) => {
        const day = parseMatchDay(rawDate);
        if (!day) return null;
        const dt = new Date(day.getTime());
        const t = (rawDate || '').toString().match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
        if (!t) {
          dt.setHours(12, 0, 0, 0);
          return dt;
        }
        let hour = Number(t[1]);
        const minute = Number(t[2]);
        const ampm = (t[3] || '').toLowerCase();
        if (ampm === 'pm' && hour < 12) hour += 12;
        if (ampm === 'am' && hour === 12) hour = 0;
        dt.setHours(hour, Number.isFinite(minute) ? minute : 0, 0, 0);
        return dt;
      };

      const isAutoPastMatch = (match) => {
        const dayDate = parseMatchDay(match?.date);
        if (!dayDate) return false;
        const today = new Date();
        const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        return todayStart.getTime() > dayDate.getTime();
      };

      const renderSchedule = () => {
        const container = document.getElementById('scheduleList');
        if (!container) return;
        container.innerHTML = '';

        const filteredMatches = schedules.filter(match => {
          const safeSport = normalizeSport(match.sport);
          const finished = isMatchFinished(match.id);
          if (currentTab === 'upcoming' && finished) return false;
          if (currentTab === 'past' && !finished) return false;
          if (currentSport !== 'all' && safeSport !== currentSport) return false;
          if (currentLevel !== 'all' && normalizeText(match.level) !== normalizeText(currentLevel)) return false;
          if (!matchesGender(match.gender, currentGender)) return false;
          return matchesQuery(match.home, match.away, match.location, match.date, safeSport, match.level, match.gender);
        });
        filteredMatches.sort((a, b) => {
          const aTime = parseMatchDateTime(a?.date)?.getTime() ?? Number.POSITIVE_INFINITY;
          const bTime = parseMatchDateTime(b?.date)?.getTime() ?? Number.POSITIVE_INFINITY;
          if (aTime !== bTime) return aTime - bTime;
          return Number(a?.id || 0) - Number(b?.id || 0);
        });

        if (filteredMatches.length === 0) {
          container.innerHTML = `
            <div class="empty-msg">
              ${currentTab === 'upcoming' ? 'No upcoming matches' : 'No completed matches'}
              <div class="empty-actions">
                <button id="clearFiltersBtnEmpty" class="empty-reset-btn" type="button">Clear filters</button>
              </div>
            </div>
          `;
          return;
        }

        filteredMatches.forEach(match => {
          const homeTeam = teams.find(t => t.name === match.home) || { name: match.home, logo: placeholderLogo };
          const awayTeam = teams.find(t => t.name === match.away) || { name: match.away, logo: placeholderLogo };
          const safeSport = normalizeSport(match.sport);
          const finished = isMatchFinished(match.id);
          const result = getMatchResult(match.id);

          const counts = getCountsForMatch(match.id);
          const homeVotes = Number(counts.home || 0);
          const drawVotes = Number(counts.draw || 0);
          const awayVotes = Number(counts.away || 0);
          const totalVotes = homeVotes + drawVotes + awayVotes;
          const homePercent = totalVotes === 0 ? 33 : Math.round((homeVotes / totalVotes) * 100);
          const drawPercent = totalVotes === 0 ? 33 : Math.round((drawVotes / totalVotes) * 100);
          const awayPercent = totalVotes === 0 ? 34 : Math.max(0, 100 - homePercent - drawPercent);

          const votedChoice = getVote(match.id);
          const displayDate = formatMatchDate(match.date);

          const card = document.createElement('div');
          card.className = 'match-card';
          card.id = `match-${match.id}`;
          card.dataset.matchId = match.id;
          card.dataset.detail = `details.html?id=${match.id}`;

          const subscribed = isMatchSubscribed(match.id);
          const subscribeIcon = subscribed ? '🔔' : '🔕';

          // Sport badge
          const sportEmoji = safeSport === 'basketball' ? '🏀' : safeSport === 'volleyball' ? '🏐' : '⚽';
          const sportLabel = safeSport === 'basketball' ? 'Basketball' : safeSport === 'volleyball' ? 'Volleyball' : 'Soccer';
          const safeHomeName = escapeHTML(homeTeam.name);
          const safeAwayName = escapeHTML(awayTeam.name);
          const safeLocation = escapeHTML(match.location || '');
          const safeLevelInfo = escapeHTML(match.level ? `${match.level}` : 'N/A');
          const safeGenderInfo = escapeHTML(match.gender ? ` · ${match.gender}` : '');
          const safeDisplayDate = escapeHTML(displayDate);
          const safeSportLabel = escapeHTML(sportLabel);

          let scoreHtml = '';
          if (finished && result) {
            scoreHtml = `
              <div class="final-score">
                <span class="score-home">${result.homeScore}</span>
                <span class="score-sep">-</span>
                <span class="score-away">${result.awayScore}</span>
              </div>
            `;
          }

          let voteHtml = '';
          if (!finished) {
            const prev = lastVotePercents[match.id];
            const canAnimateBars = !!prev && (
              Number(prev.home) !== homePercent ||
              Number(prev.draw) !== drawPercent ||
              Number(prev.away) !== awayPercent
            );
            const startHome = canAnimateBars ? Number(prev.home) : homePercent;
            const startDraw = canAnimateBars ? Number(prev.draw) : drawPercent;
            const startAway = canAnimateBars ? Number(prev.away) : awayPercent;

            voteHtml = `
              <div class="vote-section">
                <div class="vote-btns">
                  <button class="vote-btn match-vote ${votedChoice === 'home' ? 'active' : ''}" data-match="${match.id}" data-side="home" ${votedChoice ? 'disabled' : ''}>Vote ${safeHomeName}</button>
                  <button class="vote-btn match-vote ${votedChoice === 'draw' ? 'active' : ''}" data-match="${match.id}" data-side="draw" ${votedChoice ? 'disabled' : ''}>Vote Draw</button>
                  <button class="vote-btn match-vote ${votedChoice === 'away' ? 'active' : ''}" data-match="${match.id}" data-side="away" ${votedChoice ? 'disabled' : ''}>Vote ${safeAwayName}</button>
                </div>
                <div
                  class="vote-bar-container"
                  data-animate="${canAnimateBars ? '1' : '0'}"
                  data-target-home="${homePercent}"
                  data-target-draw="${drawPercent}"
                  data-target-away="${awayPercent}"
                >
                  <div class="vote-bar-left" style="width: ${startHome}%"></div>
                  <div class="vote-bar-mid" style="width: ${startDraw}%"></div>
                  <div class="vote-bar-right" style="width: ${startAway}%"></div>
                </div>
                <div class="vote-stats">
                  <span>${homePercent}%</span>
                  <span>${drawPercent}%</span>
                  <span>${awayPercent}%</span>
                </div>
              </div>
            `;
          }

          // Level info
          card.innerHTML = `
            <span class="sport-badge ${safeSport}">${sportEmoji} ${safeSportLabel}</span>
            <div class="match-date">${safeDisplayDate}</div>
            <button class="subscribe-btn match-subscribe ${subscribed ? 'active' : ''}" data-match="${match.id}" aria-pressed="${subscribed}" aria-label="${subscribed ? 'Subscribed' : 'Subscribe'}">${subscribeIcon}</button>
            <div class="match-content">
              <div class="team-vs">
                <img src="${homeTeam.logo}" alt="${safeHomeName}" class="team-logo" loading="lazy" decoding="async">
                <span>${safeHomeName}</span>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span class="vs-badge">VS</span>
                <div class="match-location">${safeLocation}</div>
                <div class="match-meta">${safeLevelInfo}${safeGenderInfo}</div>
              </div>
              <div class="team-vs">
                <img src="${awayTeam.logo}" alt="${safeAwayName}" class="team-logo" loading="lazy" decoding="async">
                <span>${safeAwayName}</span>
              </div>
            </div>
            ${scoreHtml}
            ${voteHtml}
          `;
          container.appendChild(card);

          if (!finished) {
            lastVotePercents[match.id] = { home: homePercent, draw: drawPercent, away: awayPercent };
          }
        });

        requestAnimationFrame(() => {
          container.querySelectorAll('.vote-bar-container[data-animate="1"]').forEach((barContainer) => {
            const home = Number(barContainer.getAttribute('data-target-home') || 0);
            const draw = Number(barContainer.getAttribute('data-target-draw') || 0);
            const away = Number(barContainer.getAttribute('data-target-away') || 0);
            const leftBar = barContainer.querySelector('.vote-bar-left');
            const midBar = barContainer.querySelector('.vote-bar-mid');
            const rightBar = barContainer.querySelector('.vote-bar-right');
            if (leftBar) leftBar.style.width = `${home}%`;
            if (midBar) midBar.style.width = `${draw}%`;
            if (rightBar) rightBar.style.width = `${away}%`;
          });
        });
      };

      const vote = async (matchId, side) => {
        const match = schedules.find(m => m.id === matchId);
        if (!match) return;
        if (hasVoted(matchId)) return;
        if (useFirebase) {
          try {
            await voteRemote(matchId, side);
            storeVote(matchId, side);
            renderSchedule();
            pulseCard(matchId);
            showToast('Vote submitted');
          } catch (e) {
            console.warn('Remote vote failed, falling back to localStorage.', e);
            const counts = getCountsForMatch(matchId);
            if (side === 'home') counts.home = (counts.home || 0) + 1;
            else if (side === 'away') counts.away = (counts.away || 0) + 1;
            else if (side === 'draw') counts.draw = (counts.draw || 0) + 1;
            setCountsForMatch(matchId, counts);
            storeVote(matchId, side);
            renderSchedule();
            pulseCard(matchId);
            showToast('Vote submitted');
          }
        } else {
          const counts = getCountsForMatch(matchId);
          if (side === 'home') counts.home = (counts.home || 0) + 1;
          else if (side === 'away') counts.away = (counts.away || 0) + 1;
          else if (side === 'draw') counts.draw = (counts.draw || 0) + 1;
          setCountsForMatch(matchId, counts);
          storeVote(matchId, side);
          renderSchedule();
          pulseCard(matchId);
          showToast('Vote submitted');
        }
      };

      // Tab switching
      const tabs = Array.from(document.querySelectorAll('.tab-btn'));
      const activateTab = (btn) => {
        tabs.forEach((b) => {
          const selected = b === btn;
          b.classList.toggle('active', selected);
          b.setAttribute('aria-selected', String(selected));
          b.tabIndex = selected ? 0 : -1;
        });
        currentTab = btn.dataset.tab;
        renderSchedule();
      };
      tabs.forEach((btn) => {
        btn.addEventListener('click', () => activateTab(btn));
      });
      document.querySelector('.tabs[role="tablist"]')?.addEventListener('keydown', (event) => {
        const current = tabs.findIndex((tab) => tab.classList.contains('active'));
        let next = current;
        if (event.key === 'ArrowRight') next = (current + 1) % tabs.length;
        if (event.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
        if (next !== current) {
          event.preventDefault();
          activateTab(tabs[next]);
          tabs[next].focus();
        }
      });

      // Sport filter switching
      document.querySelectorAll('.sport-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.sport-tab').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
          currentSport = btn.dataset.sport;
          renderSchedule();
        });
      });
      const levelFilter = document.getElementById('levelFilter');
      if (levelFilter) {
        levelFilter.addEventListener('change', () => {
          currentLevel = levelFilter.value || 'all';
          renderSchedule();
        });
      }
      const genderFilter = document.getElementById('genderFilter');
      if (genderFilter) {
        genderFilter.addEventListener('change', () => {
          currentGender = normalizeText(genderFilter.value || 'all');
          renderSchedule();
        });
      }
      document.getElementById('clearFiltersBtnTop')?.addEventListener('click', clearAllFilters);

      // Subscribe button
      document.addEventListener('click', async (event) => {
        const matchBtn = event.target.closest('.match-subscribe');
        const voteBtn = event.target.closest('.match-vote');
        const clearBtn = event.target.closest('#clearFiltersBtnEmpty');
        if (clearBtn) {
          clearAllFilters();
          return;
        }
        if (voteBtn) {
          event.stopPropagation();
          const id = Number(voteBtn.dataset.match);
          const side = (voteBtn.dataset.side || '').trim();
          if (Number.isFinite(id) && (side === 'home' || side === 'draw' || side === 'away')) {
            await vote(id, side);
          }
          return;
        }
        if (!matchBtn) return;
        event.stopPropagation();
        const id = Number(matchBtn.dataset.match);
        const subs = getSubs();
        const wasSubscribed = !!subs[id];
        if (!wasSubscribed) {
          // Request notification permission on subscribe
          requestNotifPermission().then((granted) => {
            if (!granted) {
              showToast('Notification permission required. Check browser settings.');
            }
          });
        }
        subs[id] = !wasSubscribed;
        setSubs(subs);
        renderSchedule();
        showToast(wasSubscribed ? 'Notification removed' : 'Notification set 🔔');
      });

      // Card click -> detail page
      document.addEventListener('click', (event) => {
        const card = event.target.closest('.match-card');
        if (!card) return;
        if (event.target.closest('button, a, input, textarea, select')) return;
        const detailUrl = card.dataset.detail || `details.html?id=${card.dataset.matchId || ''}`;
        if (!detailUrl) return;
        window.location.href = detailUrl;
      });

      // Search
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (event) => {
          searchQuery = normalizeText(event.target.value);
          renderSchedule();
          updateSearchSuggestions();
        });
        searchInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') pushRecentSearch(searchInput.value);
        });
        searchInput.addEventListener('blur', () => {
          pushRecentSearch(searchInput.value);
          updateSearchSuggestions();
        });
      }
      updateSearchSuggestions();

      // ========== Notification System ==========
      const NOTIF_SENT_KEY = 'bis_notif_sent';

      const getSentNotifs = () => {
        try { return JSON.parse(localStorage.getItem(NOTIF_SENT_KEY) || '{}'); } catch (e) { return {}; }
      };
      const markNotifSent = (key) => {
        const sent = getSentNotifs();
        sent[key] = Date.now();
        // Clean up old notification records (30+ days)
        const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
        Object.keys(sent).forEach((k) => { if (sent[k] < cutoff) delete sent[k]; });
        try { localStorage.setItem(NOTIF_SENT_KEY, JSON.stringify(sent)); } catch (e) {}
      };
      const wasNotifSent = (key) => !!getSentNotifs()[key];

      const requestNotifPermission = async () => {
        if (!('Notification' in window)) return false;
        if (Notification.permission === 'granted') return true;
        if (Notification.permission === 'denied') return false;
        const result = await Notification.requestPermission();
        return result === 'granted';
      };

      const sendBrowserNotification = (title, body, matchId) => {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        try {
          const notif = new Notification(title, {
            body: body,
            icon: ASSET_BASE + 'assets/bismascot.png',
            badge: ASSET_BASE + 'assets/bismascot.png',
            tag: `bis-match-${matchId}`,
            renotify: true,
            requireInteraction: false
          });
          notif.onclick = () => {
            window.focus();
            window.location.href = `details.html?id=${matchId}`;
            notif.close();
          };
          // 10s auto-close
          setTimeout(() => notif.close(), 10000);
        } catch (e) { console.warn('Notification send failed:', e); }
      };

      const getDaysUntilMatch = (matchDate) => {
        if (!matchDate) return null;
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const matchDayStart = new Date(matchDate.getFullYear(), matchDate.getMonth(), matchDate.getDate());
        const diffMs = matchDayStart.getTime() - todayStart.getTime();
        return Math.round(diffMs / (24 * 60 * 60 * 1000));
      };

      const getMinutesUntilMatch = (matchDateTime) => {
        if (!matchDateTime) return null;
        const now = new Date();
        return (matchDateTime.getTime() - now.getTime()) / (60 * 1000);
      };

      const formatMatchInfo = (match) => {
        const homeTeam = teams.find(t => t.name === match.home) || { name: match.home };
        const awayTeam = teams.find(t => t.name === match.away) || { name: match.away };
        const sportEmoji = match.sport === 'basketball' ? '🏀' : match.sport === 'volleyball' ? '🏐' : '⚽';
        return {
          teams: `${homeTeam.name} vs ${awayTeam.name}`,
          sportEmoji,
          location: match.location || 'TBD',
          date: formatMatchDate(match.date)
        };
      };

      const checkAndSendNotifications = () => {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const subs = getSubs();
        const subscribedIds = Object.keys(subs).filter((id) => subs[id]);
        if (subscribedIds.length === 0) return;

        subscribedIds.forEach((matchIdStr) => {
          const matchId = Number(matchIdStr);
          const match = schedules.find((m) => Number(m.id) === matchId);
          if (!match) return;
          if (isMatchFinished(matchId)) return;

          const matchDay = parseMatchDay(match.date);
          const matchDateTime = parseMatchDateTime(match.date);
          if (!matchDay) return;

          const daysUntil = getDaysUntilMatch(matchDay);
          const minutesUntil = matchDateTime ? getMinutesUntilMatch(matchDateTime) : null;
          const info = formatMatchInfo(match);

          // D-3: 3 days before
          const d3Key = `${matchId}_d3`;
          if (daysUntil === 3 && !wasNotifSent(d3Key)) {
            sendBrowserNotification(
              `${info.sportEmoji} Match in 3 days!`,
              `${info.teams}\n📅 ${info.date} | 📍 ${info.location}`,
              matchId
            );
            markNotifSent(d3Key);
          }

          // D-2: 2 days before
          const d2Key = `${matchId}_d2`;
          if (daysUntil === 2 && !wasNotifSent(d2Key)) {
            sendBrowserNotification(
              `${info.sportEmoji} Match in 2 days!`,
              `${info.teams}\n📅 ${info.date} | 📍 ${info.location}`,
              matchId
            );
            markNotifSent(d2Key);
          }

          // D-1: 1 day before
          const d1Key = `${matchId}_d1`;
          if (daysUntil === 1 && !wasNotifSent(d1Key)) {
            sendBrowserNotification(
              `${info.sportEmoji} Match is tomorrow!`,
              `${info.teams}\n📅 ${info.date} | 📍 ${info.location}`,
              matchId
            );
            markNotifSent(d1Key);
          }

          // D-Day: Match day
          const d0Key = `${matchId}_d0`;
          if (daysUntil === 0 && !wasNotifSent(d0Key)) {
            sendBrowserNotification(
              `${info.sportEmoji} Match today!`,
              `${info.teams}\n📅 ${info.date} | 📍 ${info.location}`,
              matchId
            );
            markNotifSent(d0Key);
          }

          // Match start time (2 min before ~ 1 min after)
          if (minutesUntil !== null) {
            const nowKey = `${matchId}_now`;
            if (minutesUntil <= 2 && minutesUntil >= -1 && !wasNotifSent(nowKey)) {
              sendBrowserNotification(
                `🚨 ${info.sportEmoji} Match starting now!`,
                `${info.teams} is starting now!\n📍 ${info.location}`,
                matchId
              );
              markNotifSent(nowKey);
            }
          }
        });
      };

      // Notification checker: runs every 60 seconds
      let notifInterval = null;
      const startNotifChecker = () => {
        checkAndSendNotifications();
        if (notifInterval) clearInterval(notifInterval);
        notifInterval = setInterval(checkAndSendNotifications, 60 * 1000);
      };

      // Pause/resume checker on tab visibility
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (notifInterval) { clearInterval(notifInterval); notifInterval = null; }
        } else {
          startNotifChecker();
        }
      });

      // Start on page load
      startNotifChecker();
      // ========== End Notification System ==========

      // Init Firebase and render
      const firebaseReady = initFirebaseIfConfigured();
      if (!firebaseReady) {
        renderSchedule();
      }

      // Theme toggle
      (function(){
        document.querySelectorAll('img').forEach((img, idx) => {
          if (!img.hasAttribute('decoding')) img.setAttribute('decoding', 'async');
          if (!img.hasAttribute('loading') && idx > 0) img.setAttribute('loading', 'lazy');
        });
        const toggleButton = document.querySelector('.theme-toggle');
        if(!toggleButton) return;
        const toggleIcon = document.querySelector('.toggle-icon');
        const toggleText = document.querySelector('.toggle-text');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        const applyTheme = (theme) => {
          document.body.classList.toggle('dark', theme === 'dark');
          document.body.classList.toggle('light', theme === 'light');
          const isDark = theme === 'dark';
          toggleButton.setAttribute('aria-pressed', String(isDark));
          toggleIcon.textContent = isDark ? '☀️' : '🌙';
          toggleText.textContent = isDark ? 'Light' : 'Dark';
        };
        const savedTheme = localStorage.getItem('bis-theme');
        if(savedTheme){ applyTheme(savedTheme); } else { applyTheme(prefersDark.matches ? 'dark' : 'light'); }
        prefersDark.addEventListener('change', (e)=>{ if(!localStorage.getItem('bis-theme')) applyTheme(e.matches ? 'dark' : 'light'); });
        toggleButton.addEventListener('click', ()=>{ const isDark = document.body.classList.contains('dark'); const next = isDark ? 'light' : 'dark'; localStorage.setItem('bis-theme', next); applyTheme(next); });
      })();
    </script>
  </body>
</html>
